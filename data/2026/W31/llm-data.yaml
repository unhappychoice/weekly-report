    body: A notable chunk of this week's work happened outside my personal namespace. circleci-tools/circleci-cli alone saw
      11 PRs and the most review activity of any single repo. irasutoya-tools picked up simplecov and rbs bumps across
      both irasutoya and irasutoya-cli. bitflyer-tools/bitflyer-cli got a bitflyer gem bump from 2.0.2 to 2.0.3 that
