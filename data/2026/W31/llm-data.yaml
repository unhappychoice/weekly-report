highlights:
  - type: pr
    title: "chore(deps): Bump chalk from 5.6.2 to 6.0.0"
    repo: unhappychoice/mdts
    meta: merged · +6 -6 · 2 files
    body: This wasn't just a patch bump — chalk 6.0.0 is a breaking release that drops support for Node.js below 22, making
      it the most consequential dependency upgrade of the week. Merging it signals that mdts is committing to the Node
      22+ baseline.
    url: https://github.com/unhappychoice/mdts/pull/859
  - type: pr
    title: "fix: disambiguate remote name comparison for gix 0.86"
    repo: unhappychoice/splashboard
    meta: merged
    body: The only non-Dependabot code fix of the week — gix 0.86 quietly changed how remote names are compared, and this
      patch corrected the call site before it could cause silent misbehavior in splashboard's git operations.
  - type: pr
    title: "test(models): cover the layer nothing tested directly"
    repo: unhappychoice/lintric
    meta: merged
    body: Filling in a gap in lintric's test suite by directly covering the model layer for the first time — the kind of PR
      that doesn't ship features but makes every future refactor safer.
    url: https://github.com/unhappychoice/lintric/pull/277
  - type: release
    title: v0.20.6
    repo: unhappychoice/mdts
    meta: released
    body: "A focused bug-fix release: h6 headings finally get proper styling and dead CSS variables get cleaned out. Small
      surface area, but it closes a visual inconsistency that had been lingering in the markdown renderer."
  - type: pr
    title: "chore(deps): bump bitflyer from 2.0.2 to 2.0.3"
    repo: bitflyer-tools/bitflyer-cli
    meta: merged · +1 -12 · 1 file
    body: A dependency bump that actually deleted 11 net lines — the new bitflyer gem version cleaned up its own internals
      enough to shrink the lockfile entry, which is a satisfying kind of upgrade.
    url: https://github.com/bitflyer-tools/bitflyer-cli/pull/194
