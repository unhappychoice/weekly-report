highlights:
  - type: pr
    title: "chore: sync llm pricing from LiteLLM"
    repo: unhappychoice/splashboard
    meta: merged Nov 2026 · +6 -0 · 1 file
    body: An automated daily refresh of LLM pricing data from LiteLLM's price table — the PR even ships with a review
      checklist to catch order-of-magnitude pricing jumps or silently disappeared models. A nice example of automation
      with built-in sanity checks.
    url: https://github.com/unhappychoice/splashboard/pull/373
  - type: release
    title: Release v2.10.4
    repo: unhappychoice/splashboard
    meta: released Nov 2026
    body: The most technically substantive release of the week — fixes a glibc 2.17 compatibility regression introduced by
      the sysinfo 0.39→0.40 bump by disabling unused GPU feature flags at the Cargo level.
  - type: pr
    title: "chore(deps): Bump glob from 13.0.6 to 14.0.3"
    repo: unhappychoice/mdts
    meta: merged Nov 2026 · +194 -13 · 2 files
    body: The largest diff of any PR this week at +194 -13, reflecting glob's major version jump from 13 to 14 which
      switched to minimatch internally. A bigger change than the typical one-line lockfile bump.
    url: https://github.com/unhappychoice/mdts/pull/1047
  - type: release
    title: v1.1.0
    repo: bitflyer-tools/cycle-flyer
    meta: released Nov 2026
    body: This release included a security-motivated override of ws and glob to patched versions — not just routine
      dependency bumps, but an active response to known vulnerability surface in the dependency tree.
  - type: pr
    title: "chore(deps-dev): bump electron from 45.1.0 to 45.2.1"
    repo: bitflyer-tools/cycle-flyer
    meta: merged Nov 2026 · +5 -5 · 2 files
    body: Electron 45.2.1 in late 2026 — a small but telling data point about how far the Electron ecosystem has come, and
      how actively cycle-flyer is tracking it.
    url: https://github.com/bitflyer-tools/cycle-flyer/pull/970
