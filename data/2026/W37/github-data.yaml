  - title: "fix(ci): fail Homebrew SHA step on HTTP errors"
    body: >-
      `curl -sL "$URL" | sha256sum` exits 0 on a 404, so `sha256sum` digested the error body and the Homebrew formula
      got a bogus SHA while the job stayed green.


      - Extract a `fetch_sha` helper using `curl -fsSL --retry 3 --retry-delay 5`

      - Add `set -euo pipefail` so a failed `curl` in the pipeline aborts...
