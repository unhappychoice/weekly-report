  - type: tech-debt
    heading: "Silent CI bug in gitlogue: curl eating 404s"
    body: "One of the more satisfying fixes this week was 'fix(ci): fail Homebrew SHA step on HTTP errors' in gitlogue. The
      bug was subtle: `curl -sL | sha256sum` exits 0 even on a 404, so the pipeline was happily hashing error response
      bodies and writing bogus SHAs to the Homebrew formula while reporting success. The fix extracted a `fetch_sha`
      helper with `curl -fsSL --retry 3 --retry-delay 5` and added `set -euo pipefail` to make failures actually fail.
      Classic silent CI footgun."
