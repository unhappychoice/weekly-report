    heading: Four releases shipped, including DroidFlyer v2.1.0
    body: Four projects cut releases this week. DroidFlyer v2.1.0 landed with a batch of Gradle and Kotlin dependency bumps.
      Norimaki v1.1.2 shipped with a targetSdk raise to 36 for Play Store compliance. splashboard v2.10.1 fixed a remote
      name comparison bug for gix 0.86. circleci-tools/CircleCI 2.1.1 followed with Kotlin version bumps and test
