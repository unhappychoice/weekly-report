  - type: review-summary
    heading: 64 reviews, mostly approvals — with one notable exception
    body: I logged 64 reviews this week spanning 20+ repos, and the overwhelming majority were approvals on dependency
      update PRs. The exception was lintric, where I left two comments and a changes_requested — the only repo this week
      where the review process involved actual back-and-forth. That ratio (63 approvals vs. 1 changes_requested)
      reflects a week where most work was mechanical dependency hygiene, with lintric as the sole place requiring real
      judgment.
    chips:
