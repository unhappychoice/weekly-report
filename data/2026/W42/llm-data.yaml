        value: CI restored
        color: green
  - type: repo-summary
    heading: 20+ repos touched, mdts and splashboard leading
    body: unhappychoice/mdts topped the charts with 12 PRs reviewed and merged, covering everything from MUI x-tree-view
      snapshots to eslint-plugin-jest and typescript-eslint bumps. unhappychoice/splashboard followed with 10 PRs,
      mostly Cargo crate updates plus a recurring LLM pricing sync commit. The spread across bitflyer-tools,
      circleci-tools, irasutoya-tools, and personal repos shows how much of this week was portfolio-wide housekeeping.
    chips:
