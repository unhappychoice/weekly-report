  - type: review-summary
    heading: "72 approvals: the week's real workload"
    body: With 72 review approvals across the week, reviewing was genuinely the primary activity. unhappychoice/mdts and
      unhappychoice/splashboard each drew multiple review passes, and repos like unhappychoice/gittype,
      unhappychoice/splashboard, and circleci-tools/Norimaki each got 4-8 approvals. Every single review was an approval
      — this was Dependabot hygiene at scale, not contested code review.
