highlights:
  - type: pr
    title: "ci: migrate CircleCI config to version 2.1"
    repo: circleci-tools/Norimaki
    meta: merged Oct 2026 · +12 -11 · 1 file
    body: CircleCI dropped version 2 support mid-year, silently breaking CI for all Dependabot PRs. This migration unblocked
      the entire automated update pipeline for Norimaki.
    url: https://github.com/circleci-tools/Norimaki/pull/479
  - type: pr
    title: "ci: migrate CircleCI config to version 2.1"
    repo: bitflyer-tools/DroidFlyer
    meta: merged Oct 2026 · +12 -11 · 1 file
    body: The same fix applied to DroidFlyer, restoring CI checks and making the Kotlin/Gradle Dependabot wave mergeable
      again.
    url: https://github.com/circleci-tools/Norimaki/pull/479
  - type: release
    title: v0.21.1
    repo: unhappychoice/mdts
    meta: released Oct 2026
    body: Patched a breaking change in simple-git v4's named export and overrode lodash-es under mermaid's chevrotain
      dependency — two subtle runtime bugs that would have bitten users upgrading their toolchain.
  - type: release
    title: Release v0.12.1
    repo: unhappychoice/gitlogue
    meta: released Oct 2026
    body: Fixed a Windows-specific bug where key release events were causing every keypress to fire twice — a real usability
      killer for keyboard-driven TUI navigation.
  - type: pr
    title: "chore(deps): bump cropperjs from 2.2.0 to 2.3.0"
    repo: unhappychoice/cycle-cropper
    meta: merged Oct 2026 · +85 -85 · 1 file
    body: The largest single diff of the dependency sweep at +85/-85 lines — cropperjs 2.3.0 brought enough internal changes
      to rewrite the lockfile chunk substantially.
    url: https://github.com/unhappychoice/cycle-cropper/pull/138
