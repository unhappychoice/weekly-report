    heading: faraday-net_http fix applied across three Ruby repos
    body: "A manual fix — bumping faraday to 2.15.0 and faraday-net_http to 3.5.0 — was applied to
      unhappychoice/slack_channel_stats, unhappychoice/blog, and circleci-tools/circleci-cli. This wasn't a Dependabot
      PR; it was a deliberate cross-repo patch, suggesting a compatibility issue that Dependabot wouldn't have caught on
      its own. Same commit message, same fix, three repos: classic dependency debt paid down."
