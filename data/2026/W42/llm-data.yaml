  - type: activity-pattern
    heading: Monday burst of 292, then steady cruise control
    body: Monday opened with a massive spike of 292 commits — almost certainly the automated merge wave from Dependabot PRs
      queued over the weekend all landing at once. After that, the week settled into a consistent 33–67 commit range
      from Tuesday through Saturday, then another bump to 155 on Sunday. No real rest days; this was a seven-day week of
      steady maintenance work.
