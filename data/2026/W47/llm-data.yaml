  - type: deep-dive
    heading: "CircleCI client library: V2/V3 API coverage sprint"
    body: "The circleci-tools/CircleCI Kotlin library absorbed a huge amount of API surface this week. I added CircleCI API
      v3 run support (trigger, list, wait), V2 webhook enablement and settings, deploy component listings with filters,
      OIDC claim TTL updates, usage export serialization, and pipeline trigger `eventSource` serialization. Alongside
      the new endpoints, I fixed a long tail of decode bugs: V2 job details now use the actual CircleCI response schema,
      timestamps decode as OffsetDateTime, and pipeline parameters preserve numeric types. The library also migrated to
      RxJava 3 and OkHttp 5."
    chips:
