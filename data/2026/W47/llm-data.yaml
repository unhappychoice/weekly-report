        color: green
  - type: repo-summary
    heading: Eight repos, four ecosystems, one week
    body: The top eight repos by PR count were cycle-flyer (106), circleci-tools/CircleCI (98), tapline (95), Norimaki (93),
      DroidFlyer (91), circleci-cli (89), bitflyer-cli (85), and bitflyer (84). That's Android, Kotlin, Ruby, Rust, and
      TypeScript all active simultaneously. The irasutoya and irasutoya-cli repos added image download commands, lazy
      iteration, and category browsing. oss-issue-opener got CI alert auto-closing and a pile of correctness fixes for
      dependency bump detection.
    chips:
