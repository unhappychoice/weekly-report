  - type: activity-pattern
    heading: "Wednesday detonation: 2,199 commits in one day"
    body: "The daily commit curve tells a clear story: 204 on Monday, 256 Tuesday, then 2,199 on Wednesday — a 8.6x jump.
      Thursday through Sunday held between 1,043 and 1,801. Wednesday's spike likely reflects a large batch of
      factory-branch merges landing across multiple repos simultaneously, which is consistent with the merge commit
      density visible in the logs. The week never really came down from that plateau."
