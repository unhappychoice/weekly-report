  - type: deep-dive
    heading: "Norimaki: Test Results screen and incremental log rendering"
    body: Two of the most substantial Norimaki PRs this week were the Test Results screen (675 lines across 17 files) and
      incremental build log rendering (663 lines across 15 files). The Test Results screen fetches every page of
      CircleCI job test metadata, shows failed tests with class names and expandable messages, and distinguishes
      unavailable results from zero failures. The log renderer formats chunks off the main thread, retains formatted
      lines in a RecyclerView-backed structure, and updates only the unfinished line and newly inserted rows —
      preserving ANSI colors and split escape sequences across chunks.
