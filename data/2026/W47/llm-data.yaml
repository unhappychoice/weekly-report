highlights:
  - type: pr
    title: "feat: show failed test results on build details"
    repo: circleci-tools/Norimaki
    meta: merged Nov 2026 · +675 -1 · 17 files
    body: The biggest feature addition in Norimaki this week — a full Test Results screen linked from build details that
      pages through CircleCI job test metadata and renders failed tests with expandable messages. The near-zero deletion
      count means this was pure greenfield screen work.
    url: https://github.com/circleci-tools/Norimaki/pull/569
  - type: pr
    title: "fix: verify realtime TLS certificates and hostnames"
    repo: bitflyer-tools/bitflyer
    meta: merged Nov 2026 · +454 -302 · 15 files
    body: "A significant security and reliability fix: the WebSocket connection now uses websocket-driver over an OpenSSL
      socket that verifies the certificate chain and hostname before sending the upgrade. Failed TLS handshakes close
      the socket cleanly, and the fix applies to both initial connections and automatic reconnects."
    url: https://github.com/bitflyer-tools/bitflyer/pull/754
  - type: pr
    title: "perf: reuse cached banner thumbnails when revisiting charts"
    repo: unhappychoice/tapline
    meta: merged Nov 2026 · +438 -63 · 2 files
    body: A 32-slot LRU cache for decoded banner artwork, keyed by resolved path and display dimensions. Switching between
      charts now reuses cached pixels instead of re-decoding, and the cache invalidates correctly when source file
      metadata changes.
    url: https://github.com/unhappychoice/tapline/pull/265
  - type: pr
    title: "fix: bound memory used by live watch logs"
    repo: circleci-tools/circleci-cli
    meta: merged Nov 2026 · +408 -109 · 6 files
    body: Active steps now keep at most 256 KiB of buffered output in memory before spilling to a temp file, and the watcher
      cleans up those temp files after completion or shutdown. This prevents the watch command from silently consuming
      unbounded memory on long-running builds.
    url: https://github.com/circleci-tools/circleci-cli/pull/1196
  - type: pr
    title: "feat: download images from an illustration page"
    repo: irasutoya-tools/irasutoya-cli
    meta: merged Nov 2026 · +160 -2 · 5 files
    body: Adds `irasutoya download PAGE_URL --output DIR` to save every image from a search or random result page, with
      numeric suffix collision handling and directory creation. Works without the preview renderer, making it
      scriptable.
    url: https://github.com/irasutoya-tools/irasutoya-cli/pull/732
