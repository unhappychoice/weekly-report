highlights:
  - type: pr
    title: "chore: sync llm pricing from LiteLLM"
    repo: unhappychoice/splashboard
    meta: merged Sep 2026 · +5 -0 · 1 file
    body: "The only automation-authored (non-Dependabot) PR this week: an automated daily refresh of LLM pricing data from
      LiteLLM's price table. The review checklist in the PR body — checking for order-of-magnitude jumps and silently
      disappeared models — shows real thought went into making this safe to auto-merge."
    url: https://github.com/unhappychoice/splashboard/pull/331
  - type: pr
    title: "chore(deps-dev): Bump @babel/core from 8.0.1 to 8.0.5 in /packages/frontend"
    repo: unhappychoice/mdts
    meta: merged Sep 2026 · +73 -75 · 2 files
    body: The largest diff of any dep bump this week at +73 -75, which is unusually large for a lock file update —
      suggesting the package graph shifted meaningfully with the babel 8.0.1 → 8.0.5 jump.
    url: https://github.com/unhappychoice/mdts/pull/947
  - type: pr
    title: "chore(deps)(deps): bump tachyonfx from 0.25.1 to 0.25.2"
    repo: unhappychoice/splashboard
    meta: merged Sep 2026 · +75 -20 · 1 file
    body: A patch bump with a +75 -20 diff in a single file is a red flag worth noting — tachyonfx 0.25.2 apparently brought
      substantial internal changes despite the minor version label. Worth keeping an eye on rendering behavior in
      splashboard.
    url: https://github.com/unhappychoice/splashboard/pull/335
  - type: pr
    title: "chore(deps): bump the minor-and-patch group with 7 updates"
    repo: deariary/github-weekly-reporter
    meta: merged Sep 2026 · +297 -207 · 2 files
    body: The single biggest diff of the week at +297 -207, driven by a grouped Dependabot PR updating 7 packages at once
      including the Anthropic SDK from 0.123.0 to 0.124.0. Grouped bumps keep the PR count down but make diffs harder to
      audit.
    url: https://github.com/deariary/github-weekly-reporter/pull/157
