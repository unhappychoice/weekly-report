  - type: tech-debt
    heading: vitest 5 lands in github-weekly-reporter
    body: "One non-trivial upgrade this week: deariary/github-weekly-reporter jumped from vitest 4.1.11 to 5.0.0, and this
      one was hand-crafted rather than auto-generated — the commit message shows a manual bump of both vitest and
      @vitest/coverage-v8 together. Major version test framework upgrades require a bit more care than a patch bump, so
      this one stands out from the Dependabot noise as something that actually needed human attention."
    chips:
