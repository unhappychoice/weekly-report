highlights:
  - type: release
    title: Release v0.10.2
    repo: unhappychoice/gittype
    meta: released Aug 2026
    body: Ships a fix for TUI redraw on terminal resize, contributed by 0utsights — the kind of polish that makes a terminal
      tool feel production-quality. Also rolled in clap 4.6.5 and tree-sitter-erlang 0.20.0.
  - type: pr
    title: "chore: sync llm pricing from LiteLLM"
    repo: unhappychoice/splashboard
    meta: merged Aug 2026 · +8 -8 · 1 file
    body: Automated daily refresh of llm_pricing.json from LiteLLM's price table. Keeping LLM cost data current matters a
      lot when you're building anything that tracks or displays model pricing.
    url: https://github.com/unhappychoice/splashboard/pull/312
  - type: pr
    title: "chore(deps): bump openai from 6.49.0 to 7.1.0"
    repo: deariary/github-weekly-reporter
    meta: merged Aug 2026 · +8 -5 · 2 files
    body: A full major version bump on the openai Node SDK — v7 brings meaningful API surface changes, so this is more than
      a routine patch bump.
    url: https://github.com/deariary/github-weekly-reporter/pull/150
  - type: pr
    title: Update games.yaml
    repo: ligurio/awesome-ttygames
    meta: merged Aug 2026 · +4 -0 · 1 file
    body: A small open-source contribution to the awesome-ttygames community list — adding a terminal game to a curated
      public resource.
    url: https://github.com/ligurio/awesome-ttygames/pull/92
