  - type: repo-summary
    heading: 13+ repos touched, but three owned the week
    body: cycle-flyer (12 PRs), Norimaki (11 PRs), and mdts (13 PRs) were the headline repos, but activity touched
      everything from Ruby gems to Rust crates to Kotlin Android apps. Norimaki saw real feature work too — tablet
      two-pane layout, screen transition animations, workflow and job name display, and a fix replacing Pusher with
      polling for realtime build log updates. mdts was mostly dependency maintenance but did pick up a chokidar major
      version bump (4.x → 6.x) as a manual fix.
