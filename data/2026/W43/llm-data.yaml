  - type: deep-dive
    heading: "terminal_image and cycle-cropper: two quiet but solid library improvements"
    body: terminal_image gained an ANSI truecolor fallback path that converts non-PNG images through ImageMagick before
      rendering — with proper size validation and streaming to avoid loading large files into memory. Meanwhile,
      cycle-cropper was refactored to accept the full cropper.js options surface as React props, pinned to the stable
      1.x line, and got TypeScript 7-compatible tsconfig. Both are small libraries that got meaningfully more capable
      this week without much fanfare.
