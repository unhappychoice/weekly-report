highlights:
  - type: pr
    title: "feat(sound): play notification sounds for order results and executions"
    repo: bitflyer-tools/cycle-flyer
    meta: merged Oct 2026 · +5 -5 in electron bump context · feature branch
    body: The capstone of the week's cycle-flyer feature sprint — audio feedback for order fills and execution events.
      Landing this meant the entire stack from selectable sizes to realtime private channels was already in place
      underneath it.
    url: https://github.com/bitflyer-tools/cycle-flyer/pull/965
  - type: pr
    title: "feat: fall back to ANSI truecolor rendering"
    repo: unhappychoice/terminal_image
    meta: merged Oct 2026 · feature
    body: "A meaningful capability expansion for terminal_image: non-PNG inputs now route through ImageMagick with streaming
      and size guards, making the library genuinely useful for arbitrary image formats in terminal environments."
    url: https://github.com/unhappychoice/terminal_image/pull/607
  - type: pr
    title: "feat: accept all cropper.js options as props"
    repo: unhappychoice/cycle-cropper
    meta: merged Oct 2026 · feature
    body: Instead of cherry-picking individual cropper.js options, cycle-cropper now passes the full options object through
      as props — a clean API decision that avoids the endless prop-by-prop expansion problem.
    url: https://github.com/unhappychoice/cycle-cropper/pull/141
  - type: pr
    title: "feat: add a two-pane tablet layout"
    repo: circleci-tools/Norimaki
    meta: merged Oct 2026 · feature
    body: Norimaki's Android CI dashboard gets a proper tablet experience with a two-pane layout, part of a broader UI
      polish week that also brought screen transition animations and workflow/job name display.
    url: https://github.com/circleci-tools/Norimaki/pull/486
  - type: pr
    title: "feat: scope presence member selectors in isolated sources"
    repo: unhappychoice/cycle-pusher
    meta: merged Oct 2026 · feature
    body: "cycle-pusher's isolation story gets more complete: presence member selectors are now scoped to their channel
      namespace, preventing cross-contamination in apps with multiple isolated Pusher sources."
