title: "cycle-flyer trading feature blitz: TWAP, stop orders, and sound alerts land in one week"
subtitle: A burst of feature work across bitflyer-tools repos brings private event subscriptions, client-side order
  types, and audio notifications to the trading stack, alongside 208 commits and 29 merged PRs across a sprawling
  multi-repo week.
overview: >
  This week was dominated by a concentrated feature sprint on the bitflyer-tools trading ecosystem. cycle-flyer alone
  received six sequential feature branches — selectable size presets, persistent order settings, stop ordering,
  client-side TWAP ordering, private realtime event subscriptions, and notification sounds — all stacked and merged in a
  single week. DroidFlyer got the private events treatment too, with realtime order channel subscriptions landing on the
  Android side. It's the kind of week where a clear product vision drove a tight, purposeful commit chain rather than
  scattered maintenance.


  The week's commit curve tells an interesting story: Monday opened strong at 76, tapered through midweek, then
  absolutely exploded on Friday (259) and Saturday (525) — nearly half the week's 208 commits landed in the final two
  days. That Saturday surge suggests a deep flow state, likely fueled by the cycle-flyer feature chain where each branch
  built directly on the previous one. The stacked branch strategy (feat/selectable-size → feat/store-values →
  feat/stop-order → feat/twap-order → feat/private-events → feat/sound) is visible right in the merge commit history.


  Beyond the trading work, there were meaningful contributions elsewhere: cycle-pusher gained presence channel member
  streams and proper TypeScript 7 compatibility, terminal_image got an ANSI truecolor fallback with ImageMagick support
  for non-PNG formats, cycle-cropper opened up the full cropper.js options API as props, and the monoid-studio org got a
  public-facing refresh pointing to Ginza, Tokyo. The dependency maintenance machine also ran at full tilt — 58 reviews,
  all approvals, across 13+ repos.
summaries:
  - type: deep-dive
    heading: cycle-flyer's trading engine gets a full feature stack
    body: "Six feature branches landed in sequence this week on cycle-flyer, each building on the last: selectable size
      presets, persisted order settings, stop orders, client-side TWAP orders, private realtime event channels, and
      finally audio notifications for order results and executions. The stacked branch strategy — merging each into the
      next before rebasing to master — kept the diff clean and reviewable. The same private events feature was
      simultaneously shipped to DroidFlyer, giving the Android client realtime order channel subscriptions via PubNub.
      This is the most coherent product sprint of the week by a wide margin."
