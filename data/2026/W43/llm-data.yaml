      mid-week, then Friday and Saturday became an absolute torrent — Saturday alone accounted for more commits than
      Monday through Thursday combined. This pattern almost certainly maps to the cycle-flyer feature chain, where each
      stacked branch merge triggered a cascade of CI merges and dependency bumps across the fleet. Peak productivity
      arrived at the weekend, not the start of the week."
