highlights:
  - type: pr
    title: "feat: persist personal bests and display chart progress"
    repo: unhappychoice/tapline
    meta: merged Nov 2026 · tapline
    body: The moment tapline went from a chart player to an actual game — personal bests now persist to disk and display in
      the chart selector, giving players something to chase.
    url: https://github.com/unhappychoice/tapline/pull/177
  - type: pr
    title: "feat: support monad comprehension for multi-shot monads via replay"
    repo: kotlinz/kotlinz
    meta: merged Nov 2026 · kotlinz
    body: "The hardest piece of the kotlinz monad library: multi-shot monads like List can't use coroutine-based do-notation
      directly, so this PR implements a replay mechanism to make comprehension work correctly."
    url: https://github.com/kotlinz/kotlinz/pull/33
  - type: pr
    title: "fix(deps): migrate sha2 digest output to hybrid-array hex encoding for 0.11 bump"
    repo: unhappychoice/tapline
    meta: merged Nov 2026 · tapline
    body: Not just a version bump — sha2 0.11 changed its digest API, requiring a real migration to hybrid-array hex
      encoding rather than a one-line lockfile update.
    url: https://github.com/unhappychoice/tapline/pull/219
  - type: pr
    title: "perf: scan repositories within an organization concurrently"
    repo: unhappychoice/oss-issue-opener
    meta: merged Nov 2026 · oss-issue-opener
    body: "A meaningful performance win for oss-issue-opener: org repo scanning now runs concurrently, which matters a lot
      when you're scanning dozens of repos on a weekly schedule."
    url: https://github.com/unhappychoice/oss-issue-opener/pull/465
  - type: release
    title: Release v0.5.8
    repo: unhappychoice/steamfetch
    meta: released Nov 2026
    body: "Fixed a real CI breakage: Cargo's new build-dir layout moved the Steam API library lookup path, which this
      release patches along with a Rust 1.100 clippy lint fix."
