    heading: Dependency sweep across 20+ repos
    body: In between the big feature work, a thorough dependency maintenance pass hit every active repo. rspec-mocks,
      rspec-expectations, rspec-core, rspec-support, and prism all got bumped across terminal_image, irasutoya,
      irasutoya-cli, and slack_channel_stats. Rust repos got toml, sha2, clap, anyhow, crossterm, and proptest updates.
      The Gradle ecosystem saw gradle-wrapper, kotlin, and various Android deps updated across DroidFlyer, Norimaki,
      RxSnackbar, color-hash.kt, and CircleCI. CI runners were also pinned to ubuntu-24.04 across bitflyer-cli,
