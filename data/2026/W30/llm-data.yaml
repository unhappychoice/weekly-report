title: "lintric accuracy engine: 76 PRs of dependency resolution surgery"
subtitle: A week dominated by systematic fixes to lintric's cross-language dependency graph, shipping 5 releases and 478
  commits across 15+ repos.
overview: >
  This week was defined almost entirely by lintric — a Rust-based code dependency analysis tool that got a relentless,
  methodical overhaul. 76 of the 77 PRs touched lintric at some point, and the commit log reads like a graduate thesis:
  fixing namespace collisions, scoping match arms correctly, resolving member access by receiver type, linking trait
  implementations to their declarations. This wasn't a casual refactor — it was a deep, systematic audit of every edge
  case in how the tool models TypeScript and Rust code semantics.


  The narrative arc is fascinating: it started with infrastructure unblocking (fixing tree-sitter 0.25 API changes, tera
  2.0 migration, clippy/audit CI failures) and then pivoted into a long accuracy sprint. Each PR followed a tight
  test-fix-test loop — pin the construct with an accuracy fixture, write the fix, verify snapshots. By the end of the
  week, lintric could handle let chains, match guards, accessor pairs, abstract classes, const generic parameters,
  aliased imports, and type/value namespace separation.


  Alongside the lintric marathon, two releases shipped for mdts (v0.20.4 and v0.20.5 with auto-focus file tree and
  livereload resilience), gittype landed on winget as v0.10.1, steamfetch and gitlogue each cut releases, and a Gradle
  OOM crisis in circleci-tools/Norimaki got diagnosed and squashed. The week ended with a dramatic commit surge — 191 on
  Saturday, 261 on Sunday.
summaries:
  - type: deep-dive
    heading: "lintric: rebuilding a dependency graph from first principles"
    body: "The lintric work this week was extraordinary in scope — 50+ feature and fix PRs systematically closing accuracy
      gaps in the tool's TypeScript and Rust dependency resolution engine. The approach was rigorous: every fix came
      paired with an accuracy fixture that pinned the exact construct being handled, from `let` chain bindings and match
      guard scopes to accessor direction, abstract class member linking, and type/value namespace separation. The
      crowning achievement was moving from ad-hoc parent-tree walking to query-based extraction for both languages, and
      adding a shift diagnostic that warns when annotations were written against a different line numbering."
