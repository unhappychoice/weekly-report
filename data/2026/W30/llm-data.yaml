highlights:
  - type: pr
    title: "chore(deps): bump tree-sitter stack (0.25) and grammar crates together"
    repo: unhappychoice/lintric
    meta: merged · +263 -394 · 25 files
    body: "The coordinated tree-sitter 0.25 upgrade that Dependabot couldn't land on its own — superseding three stalled
      individual PRs and manually updating every `language()` call site to the new `LANGUAGE.into()` API. Net negative
      line count tells the story: the new API is cleaner."
    url: https://github.com/unhappychoice/lintric/pull/165
  - type: pr
    title: "chore(deps): bump tera from 1.20.1 to 2.0.0"
    repo: unhappychoice/lintric
    meta: merged · +12 -624 · 3 files
    body: A 612-line net deletion by migrating away from the removed `Context::into_json()` API to direct
      `serde_json::json!` construction — the kind of major-version bump that requires real source changes and pays off
      in simplicity.
    url: https://github.com/unhappychoice/lintric/pull/164
  - type: pr
    title: "fix(ci): raise Gradle daemon heap to fix D8 OOM on deploy"
    repo: circleci-tools/Norimaki
    meta: merged · +1 -1 · 1 file
    body: One line changed, one broken deployment pipeline unblocked — the Gradle daemon was running with default ~512 MiB
      while D8 dexing needed significantly more, and the launcher-level JVM_OPTS weren't being inherited by the daemon
      process.
    url: https://github.com/circleci-tools/Norimaki/pull/451
  - type: pr
    title: "fix(deps): add npm overrides for js-yaml, form-data, brace-expansion"
    repo: unhappychoice/cycle-pusher
    meta: merged · +28 -46 · 2 files
    body: Security updates that Dependabot kept marking as `security_update_not_possible` due to tslint's transitive pins on
      vulnerable dependency majors — solved by adding explicit npm overrides to force the safe versions through.
    url: https://github.com/unhappychoice/cycle-pusher/pull/359
  - type: release
    title: v0.20.5
    repo: unhappychoice/mdts
    meta: released Jul 2026
    body: Ships auto-focus of the current file in the left file tree and makes livereload resilient to permission errors by
      skipping inaccessible directories — two quality-of-life improvements that came from external contributors.
  - type: release
    title: Release v0.10.1
    repo: unhappychoice/gittype
    meta: released Jul 2026
    body: Adds winget package distribution, meaning gittype is now installable via `winget install unhappychoice.gittype` —
      a meaningful distribution milestone for a Rust CLI tool.
