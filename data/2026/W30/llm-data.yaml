  - type: tech-debt
    heading: Unblocking what Dependabot couldn't fix alone
    body: Several PRs this week required hands-on intervention where automated tooling hit its limits. The tree-sitter 0.25
      stack upgrade in lintric required coordinating three crates simultaneously and manually updating call sites from
      `language()` to `LANGUAGE.into()`. The tera 2.0 migration needed rewriting `Context::into_json()` usages with
      `serde_json::json!`. In cycle-pusher and cycle-flyer, transitive vulnerabilities via `tslint@6.1.3` required
      adding npm `overrides` to unpin vulnerable majors. And in circleci-tools/Norimaki, a D8 dexing OOM needed both a
      heap increase and a resource class bump to fully resolve.
    chips:
