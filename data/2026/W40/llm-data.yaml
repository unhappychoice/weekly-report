    heading: 49 approvals, zero rejections — the dep-bot whisperer
    body: Every single one of the 49 reviews this week was an approval, and the vast majority were Dependabot PRs getting a
      human eyeball before merge. The most reviewed repo by far was unhappychoice/mdts with 11 approvals, followed by
      circleci-tools/circleci-cli at 6. This kind of review volume is only sustainable with a disciplined triage mindset
      — scan, verify, approve, move on.
