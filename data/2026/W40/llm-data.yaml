highlights:
  - type: release
    title: Release v0.12.0
    repo: unhappychoice/gitlogue
    meta: released Oct 2026
    body: "The headline ship of the week: gitlogue v0.12.0 brings commit watch mode, letting users replay new commits in
      real time. Edge cases around pause, detached checkouts, and UI redraws were all ironed out before tagging."
  - type: pr
    title: "chore(deps): bump the minor-and-patch group with 7 updates"
    repo: deariary/github-weekly-reporter
    meta: merged · +84 -84 · 2 files
    body: "A single Dependabot PR bumping 7 packages at once in the weekly reporter itself — including the Anthropic SDK —
      is a satisfying meta-moment: the tool that generates these reports got its own deps updated this week."
    url: https://github.com/deariary/github-weekly-reporter/pull/163
  - type: pr
    title: "build(deps): bump gradle-wrapper from 9.7.1 to 9.8.0"
    repo: bitflyer-tools/DroidFlyer
    meta: merged · +42 -12 · 3 files
    body: Gradle 9.8.0 landed across four Android/JVM repos simultaneously — DroidFlyer, Norimaki, color-hash.kt, and
      CircleCI — making this one of the more coordinated upgrade waves of the week.
    url: https://github.com/bitflyer-tools/DroidFlyer/pull/550
  - type: pr
    title: "chore(deps-dev): Bump supertest from 7.2.2 to 7.3.0"
    repo: unhappychoice/mdts
    meta: merged · +3 -3 · 1 file
    body: Among the mdts dep parade, the supertest bump to 7.3.0 stands out — the release notes specifically mention
      stabilizing ephemeral server requests, a fix that matters for a test-heavy TypeScript monorepo.
    url: https://github.com/unhappychoice/mdts/pull/973
