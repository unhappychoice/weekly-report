        color: default
  - type: contribution-summary
    heading: "Cross-org reach: CI fixes land in 5 external orgs"
    body: The git identity fix wasn't just a personal-repo concern — it rolled out to deariary/github-weekly-reporter,
      irasutoya-tools/irasutoya and irasutoya-cli, bitflyer-tools/cycle-flyer and bitflyer-cli and bitflyer, and
      circleci-tools/circleci-cli. That's five separate GitHub orgs getting the same CI hygiene treatment in the same
      week, which speaks to how consistently the automated commit pattern had crept in everywhere.
