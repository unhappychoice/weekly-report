highlights:
  - type: release
    title: v0.21.0
    repo: unhappychoice/mdts
    meta: released Sep 2026
    body: "Shipped two meaningful bug fixes: mermaid rendering pinned to pre-v12 defaults to avoid upstream layout
      regressions, and the `/api/markdown` API endpoint now rejects non-markdown files — a quiet but important security
      improvement."
  - type: pr
    title: "chore(deps): bump faraday-http-cache from 2.7.0 to 3.0.0"
    repo: circleci-tools/circleci-cli
    meta: merged Sep 2026 · +2 -2 · 1 file
    body: A major version bump on faraday-http-cache deserves a callout — 2.x to 3.0.0 is a breaking-change boundary and
      merging it cleanly across both circleci-cli and slack_channel_stats shows the test suites held up.
    url: https://github.com/circleci-tools/circleci-cli/pull/1098
  - type: pr
    title: "chore(deps)(deps): bump clap from 4.6.3 to 4.6.7"
    repo: unhappychoice/splashboard
    meta: merged Sep 2026 · +7 -7 · 1 file
    body: clap jumped four patch versions in one go, picking up new CLI features. Keeping a TUI tool like splashboard on a
      recent clap ensures argument parsing stays ergonomic as the tool grows.
    url: https://github.com/unhappychoice/splashboard/pull/341
  - type: pr
    title: "chore(deps): bump the minor-and-patch group with 5 updates"
    repo: deariary/github-weekly-reporter
    meta: merged Sep 2026 · +17 -17 · 2 files
    body: The Anthropic SDK bumped from 0.124.0 to 0.126.0 in the very tool that generates these reports — a pleasingly
      self-referential update that keeps the AI layer current.
    url: https://github.com/deariary/github-weekly-reporter/pull/162
