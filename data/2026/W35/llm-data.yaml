title: lintric gets a real CLI overhaul while Dependabot sweeps the fleet
subtitle: Four open PRs fixing lintric's HTML output, exit codes, release pipeline, and crate metadata — plus 217
  commits merging dependency updates across 20+ repos.
overview: >
  This week split neatly into two very different modes of work. The bulk of the commit volume — 217 commits spread
  across every single day — came from Dependabot wrangling: merging Ruby, JavaScript, Rust, and Java dependency bumps
  across a sprawling fleet of repos ranging from circleci-tools/circleci-cli to bitflyer-tools/DroidFlyer to
  deariary/github-weekly-reporter. It's the kind of invisible maintenance work that keeps everything from quietly
  rotting, and this week it happened at scale.


  The more interesting story is lintric. I opened four substantive PRs there that collectively address a cluster of bugs
  that made the tool genuinely unusable in practice: HTML complexity colouring that never actually applied, a CLI that
  always exited 0 even on hard errors, a release workflow that archived a binary path that didn't exist, and missing
  crate metadata that left `lintric --help` with a blank description. These aren't cosmetic — they're the difference
  between a tool that works and one that just looks like it does. Meanwhile, gitlogue shipped v0.11.0 with Godot file
  syntax highlighting, contributed by an external collaborator.


  The review queue was heavy too — 41 reviews across the week, with mdts getting the most attention by far, including a
  back-and-forth with change requests. Sunday closed out with a remarkable 213 commits, suggesting a big merge-queue
  flush to end the week.
summaries:
  - type: deep-dive
    heading: "lintric: four bugs that made the tool non-functional"
    body: I opened four PRs against lintric this week that together address a pretty embarrassing cluster of defects. The
      HTML report's complexity colouring never applied because the CSS selector was compound and never matched; the CLI
      exited 0 on every error including unreadable paths; the release workflow tar'd a binary path that didn't exist
      because no crate declared a `[[bin]]`; and `lintric --help` rendered with an empty description because crate
      metadata was missing from Cargo.toml. Each bug was independently annoying, but together they made the tool look
      broken end-to-end. Getting these fixed is the prerequisite for any real release.
    chips:
