  - type: repo-summary
    heading: 20+ repos touched, Dependabot doing the heavy lifting
    body: "The week's commit log reads like a tour of the entire portfolio: Ruby gems bumped in circleci-cli and
      slack_channel_stats, Gradle wrapper updated in DroidFlyer, RxSnackbar, and color-hash.kt, Electron bumped in
      cycle-flyer, Rust crates updated in steamfetch, splashboard, and lintric, and a batch of 8 JS packages merged in
      github-weekly-reporter. mdts led the repo activity table with 9 PRs, followed by lintric at 8. This kind of
      dependency hygiene across 20+ repos doesn't happen by accident — it takes consistent review throughput to keep the
      queue from piling up."
    chips:
