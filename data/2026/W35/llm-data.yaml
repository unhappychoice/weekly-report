  - type: release
    heading: gitlogue v0.11.0 ships Godot syntax highlighting
    body: gitlogue tagged v0.11.0 this week, the headline feature being Godot file highlighting contributed by an external
      collaborator (merged from Flesymeb/feature/godot-syntax-highlighting). I handled the release mechanics — bumping
      the version, updating flake.nix hashes, refreshing the supported language docs, and fixing the nixpkgs pin so
      crate downloads worked again. It's a small release but it's the kind of thing that matters to the niche of
      developers using gitlogue for GDScript projects.
