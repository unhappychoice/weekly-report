highlights:
  - type: pr
    title: "fix(cli): repair complexity colouring, report file names and paths in HTML output"
    repo: unhappychoice/lintric
    meta: opened Aug 2026 · +157 -55 · 4 files
    body: The HTML report's main feature — colour-coded complexity — had never actually worked because of a compound CSS
      selector mismatch. This PR fixes that along with missing file names and paths in the output, making the report
      genuinely useful for the first time.
    url: https://github.com/unhappychoice/lintric/pull/302
  - type: pr
    title: "fix(cli): exit non-zero when analysis reports an error"
    repo: unhappychoice/lintric
    meta: opened Aug 2026 · +270 -136 · 5 files
    body: lintric was silently exiting 0 on every error — unreadable paths, failed analysis, write errors — making it
      impossible to use reliably in CI. This is the fix that makes the tool actually trustworthy in automated pipelines.
    url: https://github.com/unhappychoice/lintric/pull/301
  - type: release
    title: Release v0.11.0
    repo: unhappychoice/gitlogue
    meta: released Aug 2026
    body: Shipped Godot file syntax highlighting contributed by an external collaborator, alongside a nixpkgs fix that
      unblocked crate downloads. A clean community-contribution release.
  - type: pr
    title: "fix: repair the release workflow's binary name and packaging"
    repo: unhappychoice/lintric
    meta: opened Aug 2026 · +17 -2 · 2 files
    body: The release workflow was archiving a binary path that never existed because no crate declared a `[[bin]]` —
      meaning no published release would have ever worked. Caught and fixed before any v* tag was pushed.
    url: https://github.com/unhappychoice/lintric/pull/300
  - type: pr
    title: "chore(deps): bump the minor-and-patch group with 8 updates"
    repo: deariary/github-weekly-reporter
    meta: merged Aug 2026 · +279 -345 · 2 files
    body: The week's largest single diff by line count, bumping 8 JS packages including the Anthropic SDK from 0.116.0 to
      0.119.0. The net negative line count is a good sign — newer SDK, less lockfile bloat.
    url: https://github.com/deariary/github-weekly-reporter/pull/154
