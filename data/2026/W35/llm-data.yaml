  - type: review-summary
    heading: 41 reviews, mdts getting the most scrutiny
    body: I posted 41 reviews this week, and mdts dominated — it received multiple rounds including two changes_requested
      verdicts and a string of comment threads, suggesting some real back-and-forth rather than rubber-stamping. The
      rest of the review activity was mostly approvals on Dependabot PRs across the fleet, which is the right call when
      the diffs are a lockfile line or two. gitlogue and gittype also got review attention, with gittype picking up
      comment and created-review events that suggest active discussion.
    chips:
