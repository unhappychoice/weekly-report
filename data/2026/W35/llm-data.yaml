  - type: activity-pattern
    heading: Steady all week, then Sunday explodes with 213 commits
    body: "Commit activity was remarkably consistent Monday through Saturday — ranging from 31 to 80 commits per day with no
      true rest day. Then Sunday hit with 213 commits, nearly triple any other day. That's almost certainly a large
      merge-queue flush or a rebase cascade rather than 213 individual pieces of work, but it's a striking end to an
      already high-volume week. Total for the period: 217 commits, which means Sunday alone accounted for roughly 98% of
      the week's output by count."
