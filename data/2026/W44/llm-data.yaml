    heading: gittype 0.10.4 lands in microsoft/winget-pkgs
    body: "After releasing gittype v0.10.4, I submitted the package update to microsoft/winget-pkgs — PR #466810 titled 'New
      version: unhappychoice.gittype version 0.10.4'. Getting a release into the Windows Package Manager index is a
      small but meaningful step for discoverability of the tool outside the usual Unix-centric Rust CLI audience."
