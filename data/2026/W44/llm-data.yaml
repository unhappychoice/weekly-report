title: gittype v0.10.4 and gitlogue v0.12.2 ship with Dart tree-sitter fixes
subtitle: Two Rust CLI tools released in one week, plus a dependency sweep across 20+ repos spanning Ruby, Java,
  JavaScript, and Rust.
overview: >
  This week had two distinct stories running in parallel. On one hand, I shipped actual bug-fix releases for two of my
  Rust CLI tools: gittype v0.10.4 fixed a renamed Dart AST node (`initialized_variable_declaration`), and gitlogue
  v0.12.2 patched Swift nil literal capture and switched Dart to use the bundled highlight query from tree-sitter-dart.
  Both releases also landed on winget for gittype, which is always satisfying to see propagate through the package
  ecosystem.


  The other story was a massive dependency maintenance sweep. With 199 commits across the week, the bulk of the activity
  was Dependabot PRs flowing through roughly 20 repositories — rubocop 1.92.1 alone got bumped across at least 7 repos,
  and the okhttp3 5.5.1 update hit both DroidFlyer and Norimaki. The week ended with a dramatic surge: 170 commits on
  Oct 31 and 229 on Nov 1, suggesting a big batch of dependency merges landed right at the end of the period.


  The splashboard repo had a quieter but interesting thread — three consecutive LLM pricing syncs from LiteLLM, hinting
  at active work keeping that tool current with a fast-moving AI landscape. Across the week I reviewed 56 PRs touching
  everything from Android Gradle configs to Babel and webpack builds, which meant context-switching at a pretty
  relentless pace.
summaries:
  - type: deep-dive
    heading: Dart AST fixes unlock gittype and gitlogue releases
    body: Both gittype and gitlogue needed fixes for tree-sitter-dart 0.3.0, which renamed and restructured some AST nodes.
      In gittype I updated the reference to `initialized_variable_declaration`, while in gitlogue I switched to using
      the highlight query bundled with the new tree-sitter-dart package rather than maintaining our own. gitlogue also
      got a Swift fix — nil literals now correctly captured via the `nil_literal` node — and I added a test that asserts
      every highlight and injection query compiles, so this class of breakage gets caught automatically going forward.
    chips:
      - label: gittype
        value: v0.10.4
        color: green
      - label: gitlogue
        value: v0.12.2
        color: green
      - label: winget
        value: published
        color: default
      - label: languages fixed
        value: Dart + Swift
        color: default
  - type: repo-summary
    heading: 20+ repos touched in a cross-ecosystem dep sweep
    body: The dependency wave hit Ruby (rubocop 1.92.1 across 7 repos, faraday, parser, protocol-http stack), Java/Android
      (okhttp3 5.5.1, gson 2.15.0, Android Gradle plugin 9.5.0), JavaScript (electron 45.0.0, webpack, @mui/x-tree-view,
      @babel/core, zenn-cli), and Rust (rusqlite, uuid, open, tree-sitter-dart, tree-sitter-md, tokio). The most
      impactful single bump was probably electron 45.0.0 in cycle-flyer, a full major version jump. The webpack bump in
      mdts was interesting too — upgrading from 5.112.0 to 5.112.1 shrank the lockfile by 157 net lines.
    chips:
      - label: repos touched
        value: 20+
        color: default
      - label: PRs merged
        value: "24"
        color: default
      - label: ecosystems
