highlights:
  - type: release
    title: Release v0.10.4
    repo: unhappychoice/gittype
    meta: released Oct 2026
    body: Fixed a breaking change in tree-sitter-dart 0.3.0 where the `initialized_variable_declaration` node was renamed,
      then published to winget so Windows users get the update automatically.
  - type: release
    title: Release v0.12.2
    repo: unhappychoice/gitlogue
    meta: released Oct 2026
    body: Patched two language-specific bugs — Swift nil literal capture and Dart highlight queries — and added a
      compile-time assertion test for all highlight and injection queries to prevent regressions.
  - type: pr
    title: "chore(deps-dev): bump electron from 44.9.1 to 45.0.0"
    repo: bitflyer-tools/cycle-flyer
    meta: merged · +5 -5 · 2 files
    body: A full major version bump of Electron in the cycle-flyer desktop app — the kind of upgrade that can silently break
      native module bindings or renderer APIs, so worth keeping an eye on.
    url: https://github.com/bitflyer-tools/cycle-flyer/pull/966
  - type: pr
    title: "chore(deps-dev): Bump webpack from 5.112.0 to 5.112.1 in /packages/frontend"
    repo: unhappychoice/mdts
    meta: merged · +24 -181 · 2 files
    body: A patch-level webpack bump that somehow shrank the lockfile by 157 net lines — a reminder that even tiny version
      bumps can have outsized effects on the dependency graph.
    url: https://github.com/unhappychoice/mdts/pull/1036
  - type: pr
    title: "fix(dart): use renamed initialized_variable_declaration node"
    repo: unhappychoice/gittype
    meta: merged · part of v0.10.4
    body: The core fix that unblocked the v0.10.4 release — tree-sitter-dart 0.3.0 silently renamed this node and gittype
      was crashing on Dart files until this landed.
