        color: default
  - type: activity-pattern
    heading: Quiet mid-week, then an explosive Halloween finish
    body: "The week started strong with 88 commits on Monday, settled into a steady rhythm through Tuesday–Thursday (50, 34,
      57), then dipped to 22 on Friday before absolutely exploding over the weekend: 170 on Oct 31 and 229 on Nov 1.
      That Halloween/weekend surge accounts for nearly half the week's total 199 commits on its own. The pattern looks
      like a big batch of Dependabot PRs queued up and got bulk-merged over the weekend."
    chips:
      - label: peak day
        value: Nov 1 · 229
        color: green
      - label: quietest day
        value: Oct 30 · 22
        color: default
      - label: weekend share
        value: ~200 of 850 events
        color: default
  - type: review-summary
    heading: 56 approvals across the full repo portfolio
    body: "Every single review this week was an approval — 56 of them across repos ranging from unhappychoice/mdts (7
      reviews) and circleci-tools/circleci-cli (6 reviews) to smaller personal projects like RxSnackbar, kobito, and
      qiita-docs. This is almost entirely the rhythm of being the sole or primary maintainer across a large portfolio:
      Dependabot opens, I review and approve, the CI goes green, merge. It's not glamorous but it keeps the dependency
      graph healthy."
    chips:
